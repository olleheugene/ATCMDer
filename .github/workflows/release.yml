name: Release Installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
      - name: Build app bundle
        run: pyinstaller atcmder.spec
      - name: Package DMG
        run: |
          mkdir -p release
          APP_VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/macos/build-dmg.sh "$APP_VERSION" "dist/atcmder.app" "release"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          choco install nsis -y
      - name: Build app
        shell: pwsh
        run: pyinstaller atcmder.spec
      - name: Package installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $version = "${env:GITHUB_REF_NAME}".Substring(1)
          makensis /DAPP_VERSION=$version /DAPP_EXE=dist\atcmder.exe /DOUTPUT_FILE=release\atcmder-windows-$version-setup.exe packaging\windows\installer.nsi
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
      - name: Build binary
        run: pyinstaller atcmder.spec
      - name: Package DEB
        run: |
          mkdir -p release
          APP_VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/linux/build-deb.sh "$APP_VERSION" "dist/atcmder" "resources/app_icon.png" "release"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.deb
