name: Release Installers

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
      - name: Build app bundle
        run: pyinstaller atcmder.spec
      - name: Package DMG
        run: |
          mkdir -p release
          APP_VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/macos/build-dmg.sh "$APP_VERSION" "dist/atcmder.app" "release"
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          choco install nsis -y
      - name: Build app
        shell: pwsh
        run: pyinstaller atcmder.spec
      - name: Inspect dist output
        shell: pwsh
        run: Get-ChildItem -Recurse dist | Format-Table FullName
      - name: Package installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $version = "${env:GITHUB_REF_NAME}".Substring(1)
          $appDir = (Resolve-Path dist).Path
          $outputFile = (Join-Path (Resolve-Path release).Path "atcmder-windows-$version-setup.exe")
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "${env:ProgramFiles}\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            throw "makensis.exe not found after NSIS installation"
          }
          & $makensis /DAPP_VERSION=$version /DAPP_DIR=$appDir /DOUTPUT_FILE=$outputFile packaging\windows\installer.nsi
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
      - name: Build binary
        run: pyinstaller atcmder.spec
      - name: Package DEB
        run: |
          mkdir -p release
          APP_VERSION="${GITHUB_REF_NAME#v}"
          bash packaging/linux/build-deb.sh "$APP_VERSION" "dist/atcmder" "resources/app_icon.png" "release"
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.deb
